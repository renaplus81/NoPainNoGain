services:
  app:
    build: .
    container_name: the-last-project-app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    working_dir: /app
    ports:
      - "3000:3000"
    command: sleep infinity
    depends_on:
      - db

  db:
    image: postgres:18
    container_name: the-last-project-db
    environment:
      POSTGRES_USER: rena
      POSTGRES_PASSWORD: rena
      POSTGRES_DB: heyjude
    volumes:
      - db_data:/var/lib/postgresql

volumes:
  node_modules:
  db_data:

